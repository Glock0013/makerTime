<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Підключення стилів -->
    <link rel="stylesheet" href="style.css" />

    <title>4cast</title>
  </head>
  <body>
    <header >
      <h1 id="h1"> </h1>
      <h1>Enter your city: </h1>
      <form id="form">
      <input id="userInput" type="text" placeholder="Type city name here" required>
      <input type="submit" >
    </form>
    </header>
    <div class="iNeedToHideThis">
    <img id="background-img" src="" alt="">

    <div id="weather">
    <png src="" alt="">
    <h1 id="weatherH1">
      
    </h1>
  </div>

    <main id="main" >
      <div id="temp">
        
          <div id="tempC">
            tempC=
          </div>
          <div id="f">
            tempF=
          </div>
      </div>


        
      </div>
      <div id="forecast"  class="iNeedToHideThis">
        <h2>Forecast</h2>
        <div>Date</div>
        <div>icon</div>
        <div>text</div>
        <div>maxtemp_c</div>
        <div>mintemp_c</div>
        <div>avgtemp_c</div>
        <div>daily_chance_of_rain</div>
      </div>

      
      <div id="other" class="iNeedToHideThis">
        <h2>Other</h2>
        <div>feels-like=</div>
        <div>wind-speed=</div>
        <div>wind_dir</div>
        <div>chance of rain=</div>
        <div>humidity=</div>
        <div>visibility=</div>
        <div>Atmospheric pressure=</div>
      </div>
    </main>
    <footer>

    </footer>
  </div>
